<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f3f0e8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111217" media="(prefers-color-scheme: dark)">
<title>Investor Portal</title>
<script>
  /* Apply this device's saved light/dark choice before first paint. */
  try { var t = localStorage.getItem("lh-theme"); if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t); } catch (e) {}
</script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231e2757'/%3E%3Crect x='6' y='6' width='52' height='52' rx='9' fill='none' stroke='%23c9a45c' stroke-opacity='.6' stroke-width='2'/%3E%3Ctext x='32' y='44' text-anchor='middle' font-family='Georgia,serif' font-size='34' fill='%23efe7d2'%3EL%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400..700&family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400..500&display=swap">
<style>
  /* ============================================================
     Leviticus Holdings — "ledger" design system
     Paper & ink, one indigo accent, serif for the masthead and
     headings, sans for every figure, hairlines instead of boxes.
     ============================================================ */
  :root {
    color-scheme: light;
    --paper: #f3f0e8;
    --surface: #fbfaf6;
    --surface-2: #f4f1e9;
    --ink: #1a1915;
    --ink-2: #4f4b43;
    --muted: #6f6a60;
    --faint: #a19b8f;
    --rule: #e4dfd3;
    --rule-2: #cfc8b8;
    --accent: #3649a8;
    --accent-hover: #2c3d93;
    --accent-wash: rgba(54, 73, 168, .10);
    --on-accent: #ffffff;
    --gold: #7d6027;
    --pos: #1d6b45;
    --pos-wash: rgba(29, 107, 69, .12);
    --neg: #a63a2b;
    --neg-wash: rgba(166, 58, 43, .08);
    --alert: #a63a2b;
    --series-a: #3649a8;   /* Portfolio: the emphasized series */
    --series-b: #a29c8e;   /* S&P 500 / cash: context gray */
    --cover: #1e2757;
    --cover-ink: #efe7d2;
    --cover-gold: #c9a45c;
    --shadow: 0 1px 2px rgba(26, 25, 21, .04), 0 12px 32px -20px rgba(26, 25, 21, .22);
    --serif: "Newsreader", "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    --sans: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --r: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --paper: #111217;
      --surface: #181a20;
      --surface-2: #1f2128;
      --ink: #ede9e0;
      --ink-2: #bdb8ad;
      --muted: #959087;
      --faint: #6c6861;
      --rule: #2a2d35;
      --rule-2: #3c404a;
      --accent: #7885ea;
      --accent-hover: #8e99f0;
      --accent-wash: rgba(120, 133, 234, .15);
      --on-accent: #0e1233;
      --gold: #cfa557;
      --pos: #56c490;
      --pos-wash: rgba(86, 196, 144, .14);
      --neg: #f08272;
      --neg-wash: rgba(240, 130, 114, .12);
      --alert: #8e3328;
      --series-a: #7885ea;
      --series-b: #6f6b64;
      --cover: #161c40;
      --shadow: 0 1px 2px rgba(0, 0, 0, .35), 0 14px 36px -20px rgba(0, 0, 0, .6);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --paper: #111217;
    --surface: #181a20;
    --surface-2: #1f2128;
    --ink: #ede9e0;
    --ink-2: #bdb8ad;
    --muted: #959087;
    --faint: #6c6861;
    --rule: #2a2d35;
    --rule-2: #3c404a;
    --accent: #7885ea;
    --accent-hover: #8e99f0;
    --accent-wash: rgba(120, 133, 234, .15);
    --on-accent: #0e1233;
    --gold: #cfa557;
    --pos: #56c490;
    --pos-wash: rgba(86, 196, 144, .14);
    --neg: #f08272;
    --neg-wash: rgba(240, 130, 114, .12);
    --alert: #8e3328;
    --series-a: #7885ea;
    --series-b: #6f6b64;
    --cover: #161c40;
    --shadow: 0 1px 2px rgba(0, 0, 0, .35), 0 14px 36px -20px rgba(0, 0, 0, .6);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body {
    min-height: 100vh; font-family: var(--sans); font-size: 15px; line-height: 1.55;
    color: var(--ink); background: var(--paper);
    -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  b, strong { font-weight: 600; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .pos { color: var(--pos); }
  .neg { color: var(--neg); }
  .muted { color: var(--muted); }
  .warn { color: var(--neg); }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
  .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

  /* ---------- Seal (monogram) ---------- */
  .seal {
    position: relative; flex: none; width: 34px; height: 34px;
    display: inline-grid; place-items: center;
    border: 1px solid currentColor; border-radius: 3px;
    font-family: var(--serif); font-size: 15px; font-weight: 600; letter-spacing: .04em; line-height: 1;
  }
  .seal::after { content: ""; position: absolute; inset: 3px; border: 1px solid currentColor; border-radius: 1px; opacity: .35; }

  /* ---------- Loading ---------- */
  .loading { min-height: 100vh; display: grid; place-items: center; color: var(--muted); }
  .loading-in { display: flex; flex-direction: column; align-items: center; gap: 14px; font-size: 13.5px; }
  .loading .seal { width: 44px; height: 44px; font-size: 19px; color: var(--ink); }

  /* ---------- Sign-in / setup ---------- */
  .auth { min-height: 100vh; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .cover {
    position: relative; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; gap: 48px;
    padding: 58px 62px; background: var(--cover); color: var(--cover-ink);
  }
  .cover::before, .cover::after { content: ""; position: absolute; pointer-events: none; border: 1px solid var(--cover-gold); }
  .cover::before { inset: 20px; opacity: .45; }
  .cover::after { inset: 25px; opacity: .2; }
  .cover-top {
    display: flex; align-items: center; gap: 14px; color: var(--cover-gold);
    font-family: var(--mono); font-size: 11px; letter-spacing: .18em; text-transform: uppercase;
  }
  .cover-rule { width: 64px; height: 1px; margin-bottom: 26px; background: var(--cover-gold); }
  .cover-title { font-family: var(--serif); font-weight: 400; font-size: clamp(46px, 5.6vw, 78px); line-height: 1; letter-spacing: -.02em; }
  .cover-sub { max-width: 34ch; margin-top: 18px; font-size: 15px; line-height: 1.6; color: rgba(239, 231, 210, .72); }
  .auth-main { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 64px 32px 40px; }
  .auth-tools { position: absolute; top: 18px; right: 18px; }
  .auth-card { width: 100%; max-width: 380px; }
  .auth-title { font-family: var(--serif); font-weight: 500; font-size: 32px; line-height: 1.15; letter-spacing: -.01em; }
  .auth-lede { margin-top: 6px; font-size: 14.5px; color: var(--muted); }
  .seg {
    display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; margin: 26px 0 20px;
    background: var(--surface-2); border: 1px solid var(--rule); border-radius: 10px;
  }
  .seg button { height: 38px; border: 0; border-radius: 7px; background: transparent; color: var(--ink-2); font-size: 14px; font-weight: 500; }
  .seg button:hover { color: var(--ink); }
  .seg button.on { background: var(--surface); color: var(--ink); box-shadow: 0 0 0 1px var(--rule), 0 1px 3px rgba(26, 25, 21, .08); }
  .auth-err { min-height: 20px; margin-top: 12px; font-size: 13px; color: var(--neg); }
  .auth-note { margin-top: 12px; padding-top: 16px; border-top: 1px solid var(--rule); font-size: 13px; line-height: 1.6; color: var(--muted); }
  .auth-foot { margin-top: 36px; font-size: 12px; color: var(--muted); text-align: center; }
  .setup-list { list-style: none; display: grid; gap: 8px; margin: 24px 0 8px; }
  .setup-list li {
    display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px;
    background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; font-size: 13.5px; line-height: 1.5;
  }
  .setup-list .chk {
    flex: none; width: 20px; height: 20px; margin-top: 1px; display: grid; place-items: center;
    border: 1.5px solid var(--rule-2); border-radius: 50%; font-size: 11px; font-weight: 700;
  }
  .setup-list li.is-ok .chk { background: var(--pos); border-color: var(--pos); color: var(--surface); }
  @media (max-width: 860px) {
    .auth { grid-template-columns: 1fr; }
    .cover { gap: 34px; padding: 34px 30px 36px; }
    .cover::before { inset: 12px; }
    .cover::after { inset: 16px; }
    .cover-title { font-size: 42px; }
    .auth-main { justify-content: flex-start; padding: 40px 20px 32px; }
    .auth-tools { top: 10px; right: 10px; }
  }

  /* ---------- App chrome ---------- */
  .chrome { position: sticky; top: 0; z-index: 40; }
  .statusbar { background: var(--paper); border-bottom: 1px solid var(--rule); color: var(--muted); font-size: 12px; }
  .statusbar-in { max-width: 1160px; min-height: 30px; margin: 0 auto; padding: 6px 32px; display: flex; align-items: center; gap: 18px; }
  .sb-conf { font-family: var(--mono); font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--gold); }
  .sb-sync { margin-left: auto; text-align: right; }
  .statusbar.is-error { background: var(--alert); border-bottom-color: var(--alert); color: #fff; }
  .statusbar.is-error .sb-date, .statusbar.is-error .sb-conf { display: none; }
  .statusbar.is-error .sb-sync { margin-left: 0; text-align: left; font-weight: 600; }
  .masthead {
    background: var(--paper); background: color-mix(in srgb, var(--paper) 90%, transparent);
    -webkit-backdrop-filter: saturate(1.3) blur(12px); backdrop-filter: saturate(1.3) blur(12px);
    border-bottom: 1px solid var(--rule);
  }
  .mast-in { max-width: 1160px; height: 64px; margin: 0 auto; padding: 0 32px; display: flex; align-items: center; gap: 32px; }
  .brand { min-width: 0; display: flex; align-items: center; gap: 12px; padding: 0; border: 0; background: none; color: var(--ink); text-align: left; }
  .wordmark { overflow: hidden; font-family: var(--serif); font-size: 21px; font-weight: 500; letter-spacing: -.005em; white-space: nowrap; text-overflow: ellipsis; }
  .tabs { align-self: stretch; display: flex; gap: 2px; }
  .tab { position: relative; padding: 0 12px; border: 0; background: none; color: var(--ink-2); font-size: 14px; font-weight: 500; white-space: nowrap; }
  .tab:hover, .tab.is-active { color: var(--ink); }
  .tab.is-active::after { content: ""; position: absolute; left: 12px; right: 12px; bottom: -1px; height: 2px; border-radius: 2px 2px 0 0; background: var(--accent); }
  .mast-actions { margin-left: auto; display: flex; align-items: center; gap: 4px; }
  .icon-btn { width: 36px; height: 36px; display: inline-grid; place-items: center; border: 1px solid transparent; border-radius: 8px; background: none; color: var(--ink-2); }
  .icon-btn:hover { color: var(--ink); background: var(--surface-2); border-color: var(--rule); }
  .icon-btn svg { width: 18px; height: 18px; }
  .text-btn { height: 36px; padding: 0 12px; border: 0; border-radius: 8px; background: none; color: var(--ink-2); font-size: 14px; font-weight: 500; white-space: nowrap; }
  .text-btn:hover { color: var(--ink); background: var(--surface-2); }
  .i-sun { display: none; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .i-sun { display: block; }
    :root:not([data-theme="light"]) .i-moon { display: none; }
  }
  :root[data-theme="dark"] .i-sun { display: block; }
  :root[data-theme="dark"] .i-moon { display: none; }

  /* ---------- Page ---------- */
  .page { max-width: 1160px; margin: 0 auto; padding: 40px 32px 16px; }
  .page-head { display: flex; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; gap: 14px 28px; margin-bottom: 26px; }
  .eyebrow { margin-bottom: 8px; font-family: var(--mono); font-size: 11px; font-weight: 500; letter-spacing: .16em; text-transform: uppercase; color: var(--gold); }
  .page-title { font-family: var(--serif); font-weight: 500; font-size: 38px; line-height: 1.08; letter-spacing: -.015em; }
  .back-link { display: inline-flex; align-items: center; gap: 6px; margin-bottom: 14px; padding: 0; border: 0; background: none; color: var(--accent); font-size: 13.5px; font-weight: 500; }
  .back-link:hover { text-decoration: underline; text-underline-offset: 3px; }
  .px-status { min-height: 32px; display: flex; align-items: center; gap: 10px; font-size: 12.5px; color: var(--muted); }
  .px-dot { flex: none; width: 7px; height: 7px; border-radius: 50%; background: var(--faint); }
  .px-dot.is-live { background: var(--pos); box-shadow: 0 0 0 3px var(--pos-wash); }
  .px-dot.is-stale { background: var(--gold); }
  .px-dot.is-busy { background: var(--accent); animation: lh-pulse 1s ease-in-out infinite; }
  @keyframes lh-pulse { 50% { opacity: .3; } }
  @media (prefers-reduced-motion: reduce) { .px-dot.is-busy { animation: none; } }

  .panel {
    margin-bottom: 20px; padding: 28px 30px; scroll-margin-top: 112px;
    background: var(--surface); border: 1px solid var(--rule); border-radius: var(--r); box-shadow: var(--shadow);
  }
  .panel-head { display: flex; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; gap: 12px 24px; margin-bottom: 20px; }
  .panel-title { font-family: var(--serif); font-weight: 500; font-size: 23px; line-height: 1.2; letter-spacing: -.008em; }
  .panel-sub { max-width: 80ch; margin-top: 4px; font-size: 13.5px; line-height: 1.6; color: var(--muted); }
  .panel-sub b { color: var(--ink-2); }
  .hint { max-width: 80ch; margin-bottom: 16px; font-size: 13.5px; line-height: 1.6; color: var(--muted); }
  .hint b { color: var(--ink-2); }
  .empty { padding: 8px 0 4px; font-size: 14px; color: var(--muted); }
  .sub-head { margin-top: 30px; padding-top: 24px; border-top: 1px solid var(--rule); }
  .sub-title { margin-bottom: 4px; font-family: var(--serif); font-weight: 500; font-size: 19px; line-height: 1.25; }
  .label { font-size: 13px; font-weight: 500; color: var(--muted); }
  .totals-strip {
    display: inline-block; margin-bottom: 18px; padding: 8px 12px; border-radius: 8px;
    background: var(--surface-2); font-size: 13px; color: var(--ink-2); font-variant-numeric: tabular-nums;
  }
  .totals-strip b { color: var(--ink); }

  /* ---------- Summary: hero figure + KPI row ---------- */
  .summary { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 2fr); padding: 0; overflow: hidden; }
  .hero { position: relative; padding: 32px 32px 28px; border-right: 1px solid var(--rule); }
  .hero::before { content: ""; position: absolute; top: 0; left: 32px; width: 40px; height: 3px; background: var(--accent); }
  .hero-fig { margin: 14px 0 12px; font-size: clamp(40px, 5vw, 58px); font-weight: 600; line-height: 1; letter-spacing: -.03em; }
  .hero-sub { font-size: 13.5px; color: var(--muted); }
  .kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .kpi { min-width: 0; padding: 32px 26px 26px; border-right: 1px solid var(--rule); }
  .kpi:last-child { border-right: 0; }
  .kpi-fig { margin: 14px 0 6px; font-size: 27px; font-weight: 600; line-height: 1.1; letter-spacing: -.02em; }
  .kpi-sub { font-size: 13px; color: var(--muted); }
  .kpi-sub.pos { color: var(--pos); }
  .kpi-sub.neg { color: var(--neg); }
  .disc { margin-top: 12px; padding-top: 8px; border-top: 1px dotted var(--rule-2); font-size: 11.5px; color: var(--muted); cursor: help; }
  @media (max-width: 960px) {
    .summary { grid-template-columns: 1fr; }
    .hero { border-right: 0; border-bottom: 1px solid var(--rule); }
  }
  @media (max-width: 620px) {
    .kpis { grid-template-columns: 1fr; }
    .kpi { padding: 20px 22px; border-right: 0; border-bottom: 1px solid var(--rule); }
    .kpi:last-child { border-bottom: 0; }
    .hero { padding: 28px 22px 24px; }
    .hero::before { left: 22px; }
    .kpi-fig { margin-top: 8px; }
  }

  /* ---------- Performance: chart + ledger ---------- */
  .perf { display: grid; grid-template-columns: minmax(0, 1fr) 290px; gap: 32px; align-items: start; }
  @media (max-width: 960px) { .perf { grid-template-columns: 1fr; gap: 22px; } }
  .legend { display: flex; flex-wrap: wrap; gap: 8px 18px; padding-top: 6px; font-size: 13px; color: var(--ink-2); }
  .key { display: inline-flex; align-items: center; gap: 8px; }
  .sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; }
  .sw-a { background: var(--series-a); }
  .sw-b { background: var(--series-b); }
  .chart { position: relative; min-width: 0; }
  .chart svg { display: block; width: 100%; height: auto; overflow: visible; font-family: var(--sans); }
  .g-grid { stroke: var(--rule); stroke-width: 1; }
  .g-zero { stroke: var(--rule-2); stroke-width: 1; }
  .g-tick { fill: var(--muted); font-size: 11.5px; font-variant-numeric: tabular-nums; }
  .g-x { fill: var(--ink-2); font-size: 12px; font-weight: 500; font-variant-numeric: tabular-nums; }
  .g-val { fill: var(--ink-2); font-size: 11.5px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .bar-a { fill: var(--series-a); }
  .bar-b { fill: var(--series-b); }
  .g-band { fill: transparent; transition: fill .12s; }
  .g-band.is-hot { fill: var(--surface-2); }
  .g-hit { fill: transparent; outline: none; }
  .g-hit:focus-visible { stroke: var(--accent); stroke-width: 2; }
  .chart-tip {
    position: absolute; top: 0; left: 0; z-index: 5; min-width: 164px; padding: 10px 12px;
    background: var(--ink); color: var(--paper); border-radius: 9px; box-shadow: 0 10px 28px -8px rgba(0, 0, 0, .35);
    font-size: 12.5px; line-height: 1.5; pointer-events: none; opacity: 0;
    transform: translate(-50%, calc(-100% - 12px)); transition: opacity .12s;
  }
  .chart-tip.on { opacity: 1; }
  .tip-title { margin-bottom: 4px; font-weight: 600; }
  .tip-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .tip-row .k { display: inline-flex; align-items: center; gap: 8px; opacity: .78; }
  .tip-row .v { font-weight: 600; font-variant-numeric: tabular-nums; }
  .tip-key { display: inline-block; width: 12px; height: 2px; border-radius: 1px; }
  .tk-a { background: var(--series-a); }
  .tk-b { background: var(--series-b); }
  .ledger { width: 100%; border-collapse: collapse; font-size: 14px; }
  .ledger th { padding: 0 0 10px; text-align: left; font-size: 12.5px; font-weight: 500; color: var(--muted); border-bottom: 1px solid var(--rule-2); }
  .ledger td { padding: 9px 0; border-bottom: 1px solid var(--rule); font-variant-numeric: tabular-nums; }
  .ledger th.num, .ledger td.num { padding-left: 16px; text-align: right; }
  .ledger tbody tr:last-child td { border-bottom: 0; }
  .ledger tfoot td { border-bottom: 0; }
  .ledger tfoot tr.total td { padding-top: 12px; border-top: 3px double var(--rule-2); font-size: 15px; font-weight: 600; }
  .ledger tfoot tr.cum td { padding-top: 2px; font-size: 13px; color: var(--muted); }
  .tf-sub { display: block; font-size: 11.5px; font-weight: 400; color: var(--muted); }

  /* ---------- Tables ---------- */
  .tbl-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  table.data { width: 100%; border-collapse: collapse; font-size: 14px; }
  .data th { padding: 0 12px 10px; text-align: left; font-size: 12.5px; font-weight: 500; color: var(--muted); white-space: nowrap; border-bottom: 1px solid var(--rule-2); }
  .data td { padding: 13px 12px; border-bottom: 1px solid var(--rule); vertical-align: middle; }
  .data th:first-child, .data td:first-child { padding-left: 0; }
  .data th:last-child, .data td:last-child { padding-right: 0; }
  .data th.num, .data td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .data tbody tr:last-child td { border-bottom: 0; }
  .data.edit-tbl td { padding-top: 8px; padding-bottom: 8px; }
  .data.perf-tbl { min-width: 620px; }
  .data.holdings { min-width: 560px; }
  .inv-name { font-weight: 500; }

<div id="root"></div>

<script>
"use strict";

/* =====================================================
   DEFAULT SAMPLE DATA — everything is editable in Admin
   ===================================================== */
const STORE_KEY = "fund-portal-v3";
const THEME_KEY = "lh-theme";
const ASSET_CLASSES = ["US Equity","International Equity","Fixed Income","Alternatives","Cash"];
const WITHDRAWAL_TIP = "Withdrawals are reflected in this figure: redeeming units reduces both principal and current value, " +
  "so the gain shown is on the position still held — profit already paid out is not counted again here.";

const DEFAULTS = () => ({
  at: 0, // last-edit timestamp, used for cross-device sync
  fund: { name: "Leviticus Holdings", label: "Leviticus Holdings" },
  cash: 400000,
  key: "", // optional Finnhub API key (extra quote source)
  ytd: null, // YTD return in %, entered by the manager in Settings (null = show —)
  annual: [], // yearly returns entered by the manager: [{ y: 2025, p: 12.4, s: 24.2 }]
  fees: { total: null, taken: null }, // fee tracking (USD), entered by the manager; remaining is derived
  holdings: [
    { t:"SPY",   name:"SPDR S&P 500 ETF",         cls:"US Equity",            sh:3000, fb:560 },
    { t:"AAPL",  name:"Apple Inc.",                cls:"US Equity",            sh:4000, fb:210 },
    { t:"MSFT",  name:"Microsoft Corp.",           cls:"US Equity",            sh:2500, fb:440 },
    { t:"NVDA",  name:"NVIDIA Corp.",              cls:"US Equity",            sh:3000, fb:135 },
    { t:"BRK-B", name:"Berkshire Hathaway Cl. B",  cls:"US Equity",            sh:1500, fb:500 },
    { t:"EFA",   name:"iShares MSCI EAFE ETF",     cls:"International Equity", sh:6000, fb:82  },
    { t:"AGG",   name:"iShares Core US Bond ETF",  cls:"Fixed Income",         sh:8000, fb:99  },
    { t:"GLD",   name:"SPDR Gold Shares",          cls:"Alternatives",         sh:3500, fb:310 }
  ],
  clients: [
    { id: 1, name: "Alex Morgan", email: "alex@example.com",
      contributions: [ { ym: "2023-01", amount: 1500000 }, { ym: "2025-01", amount: 1100000 } ] },
    { id: 2, name: "Jordan Lee",  email: "jordan@example.com",
      contributions: [ { ym: "2024-07", amount: 3500000 } ] }
  ],
  quotes: {} // ticker -> { price, prev, name, hist:[{ym,close}], src, at }
});

let db = DEFAULTS();
const state = { viewer: "fund", tab: "overview", refreshing: false, lastMsg: "", lastSaved: 0, editInv: null, syncErr: "", loginRole: "investor" };
let cloudMode = "unknown"; // "on" | "nostore" | "none"

/* Auth: "boot" (checking) | "local" (opened as a file — no accounts) |
   "setup" (deployed but not configured) | "login" | "in" (signed in) */
const auth = { mode: "boot", role: null, name: null, cid: null, flags: {} };
const isAdminUI = () => auth.mode === "local" || auth.role === "admin";

/* ================= Local cache ================= */
function store() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(db)); } catch (e) { /* memory only */ }
}
function loadStore() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw) return;
    const d = JSON.parse(raw);
    if (d && Array.isArray(d.holdings) && Array.isArray(d.clients)) db = Object.assign(DEFAULTS(), d);
  } catch (e) { /* ignore */ }
}

/* ================= Cloud sync (deployed on Vercel) ================= */
let saveTimer = null;
function storeAndSync() {
  db.at = Date.now();
  store();
  if (auth.mode === "in" && auth.role !== "admin") return; // server rejects non-admin writes anyway
  clearTimeout(saveTimer);
  saveTimer = setTimeout(cloudSave, 700);
}
function sessionExpired() {
  auth.mode = "login"; auth.role = null; auth.name = null; auth.cid = null;
  render();
}
async function cloudLoad() {
  try {
    const r = await fetch("/api/state", { cache: "no-store" });
    if (r.status === 501) { cloudMode = "nostore"; return null; }
    if (r.status === 401) { cloudMode = "on"; if (auth.mode === "in") sessionExpired(); return null; }
    if (!r.ok) throw new Error("http " + r.status);
    const j = await r.json();
    cloudMode = "on";
    return j && j.state ? j.state : null;
  } catch (e) { if (cloudMode === "unknown") cloudMode = "none"; return null; }
}
async function cloudSave() {
  if (cloudMode !== "on" || auth.mode !== "in" || auth.role !== "admin") return;
  try {
    const r = await fetch("/api/state", {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(db)
    });
    if (r.ok) { state.lastSaved = Date.now(); state.syncErr = ""; updateBanner(); }
    else if (r.status === 401) sessionExpired();
    else {
      const j = await r.json().catch(() => ({}));
      const why = (j.error || "HTTP " + r.status) + (j.detail ? ": " + String(j.detail).slice(0, 160) : "");
      state.syncErr = "SYNC ERROR (" + why + ") — recent edits have NOT reached other devices; retrying…";
      updateBanner();
    }
  } catch (e) {
    state.syncErr = "SYNC ERROR (no connection) — recent edits have NOT reached other devices; retrying…";
    updateBanner();
  }
}
async function pollSync() {
  if (cloudMode !== "on") return;
  if (typeof document.visibilityState === "string" && document.visibilityState !== "visible") return;
  const ae = document.activeElement;
  if (ae && /INPUT|SELECT|TEXTAREA/.test(ae.tagName || "")) return; // don't clobber while typing
  const remote = await cloudLoad();
  if (remote && remote.at && remote.at > (db.at || 0)) {
    db = Object.assign(DEFAULTS(), remote);
    ensureUnits(db);
    store(); render();
  }
}
function bannerText() {
  if (auth.mode === "in") {
    if (auth.role === "admin" && state.syncErr) return state.syncErr;
    return "Signed in as " + auth.name +
      (auth.role === "admin" ? " · edits sync to all devices" : " · read-only") +
      (state.lastSaved ? " · saved " + timeStr(state.lastSaved) : "");
  }
  if (cloudMode === "nostore") return "Deployed, but not configured — see the setup checklist";
  return "Local preview — no sign-in; changes save in this browser only. Deploy to enable accounts.";
}
const syncFailing = () => !!(state.syncErr && auth.mode === "in" && auth.role === "admin");
function updateBanner() {
  const el = $("sync-line"); if (el) el.textContent = bannerText();
  const bar = $("statusbar"); if (bar) bar.classList.toggle("is-error", syncFailing());
}

/* ================= Helpers ================= */
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const fmtMoney = (v) => v.toLocaleString("en-US", { style:"currency", currency:"USD", maximumFractionDigits:0 });
const fmtPrice = (v) => v.toLocaleString("en-US", { style:"currency", currency:"USD", minimumFractionDigits:2, maximumFractionDigits:2 });
const fmtMoneyC = (v) => Math.abs(v) >= 1e6 ? "$" + (v/1e6).toFixed(2) + "M" : Math.abs(v) >= 1e3 ? "$" + (v/1e3).toFixed(0) + "K" : "$" + v.toFixed(0);
const fmtPct = (v, signed=true) => (signed && v > 0 ? "+" : "") + (v*100).toFixed(1) + "%";
const pctClass = (v) => v >= 0 ? "pos" : "neg";
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const monthLabel = (ym) => { const [y,m] = ym.split("-"); return MONTHS[+m-1] + " " + y; };
const ymOf = (d) => d.getUTCFullYear() + "-" + String(d.getUTCMonth()+1).padStart(2,"0");
const nowYm = () => ymOf(new Date());
const validYm = (s) => /^\d{4}-(0[1-9]|1[0-2])$/.test(s);
const timeStr = (t) => new Date(t).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
/* Manager-entered yearly returns are already in percent (12.4 = +12.4%) */
const retText = (v) => (typeof v === "number" && !isNaN(v)) ? (v > 0 ? "+" : "") + v.toFixed(1) + "%" : "—";

function uniqueTickers() { return [...new Set(db.holdings.map(h => h.t.trim().toUpperCase()).filter(Boolean))]; }
function quote(t) { return db.quotes[t.trim().toUpperCase()]; }
function priceOf(h) { const q = quote(h.t); return q && q.price > 0 ? q.price : (h.fb || 0); }
function isLive(h) { const q = quote(h.t); return !!(q && q.price > 0); }
function currentClient() { return db.clients.find(c => String(c.id) === String(state.viewer)) || null; }

/* ================= Live quotes ================= */
function yahooUrl(t) {
  return "https://query1.finance.yahoo.com/v8/finance/chart/" + encodeURIComponent(t) + "?range=2y&interval=1mo";
}
function parseYahoo(j) {
  const res = j && j.chart && j.chart.result && j.chart.result[0];
  if (!res || !res.meta || !(res.meta.regularMarketPrice > 0)) throw new Error("bad payload");
  const m = res.meta;
  const closes = (res.indicators && res.indicators.quote && res.indicators.quote[0] && res.indicators.quote[0].close) || [];
  const hist = [];
  (res.timestamp || []).forEach((ts, i) => {
    const c = closes[i];
    if (c != null && c > 0) {
      const ym = ymOf(new Date(ts * 1000));
      const last = hist[hist.length-1];
      if (last && last.ym === ym) last.close = c; else hist.push({ ym, close: c });
    }
  });
  // Previous trading day's close only — chartPreviousClose refers to the
  // close before the requested 2y range, which is NOT "yesterday".
  return { price: m.regularMarketPrice,
           prev: m.regularMarketPreviousClose > 0 ? m.regularMarketPreviousClose : null,
           name: m.shortName || m.longName || null, hist };
}
function parseFinnhub(j) {
  if (!j || !(j.c > 0)) throw new Error("bad payload");
  return { price: j.c, prev: j.pc || null, name: null, hist: null };
}
async function getJSON(url, ms) {
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), ms || 9000);
  try {
    const r = await fetch(url, { signal: ctl.signal });
    if (!r.ok) throw new Error("HTTP " + r.status);
    return await r.json();
  } finally { clearTimeout(timer); }
}
/* Fallback chain used when the site API is unavailable (e.g. opened as a local file) */
async function fetchTicker(t) {
  const y = yahooUrl(t);
  const routes = [];
  if (db.key) routes.push({ src: "Finnhub", url: "https://finnhub.io/api/v1/quote?symbol=" + encodeURIComponent(t) + "&token=" + encodeURIComponent(db.key), parse: parseFinnhub });
  routes.push(
    { src: "Yahoo Finance",     url: y, parse: parseYahoo },
    { src: "Yahoo (proxy)",     url: "https://corsproxy.io/?url=" + encodeURIComponent(y), parse: parseYahoo },
    { src: "Yahoo (proxy alt)", url: "https://api.allorigins.win/raw?url=" + encodeURIComponent(y), parse: parseYahoo }
  );
  let got = null;
  for (const r of routes) {
    try { got = Object.assign(r.parse(await getJSON(r.url)), { src: r.src }); break; } catch (e) { /* next route */ }
  }
  if (!got) return null;
  if (!got.hist) {
    for (const u of [y, "https://corsproxy.io/?url=" + encodeURIComponent(y), "https://api.allorigins.win/raw?url=" + encodeURIComponent(y)]) {
      try { got.hist = parseYahoo(await getJSON(u)).hist; break; } catch (e) { /* keep going */ }
    }
  }
  return got;
}
function applyQuote(t, r) {
  const T = t.trim().toUpperCase();
  const old = db.quotes[T] || {};
  db.quotes[T] = { price: r.price, prev: r.prev, name: r.name || old.name || null,
                   hist: (r.hist && r.hist.length ? r.hist : old.hist) || null, src: r.src, at: Date.now() };
  db.holdings.forEach(x => {
    if (x.t.trim().toUpperCase() === T) {
      x.fb = r.price; // keep last-known price as offline fallback
      if (r.name && (!x.name || x.name === x.t)) x.name = r.name;
    }
  });
}
async function refreshAll() {
  if (state.refreshing) return;
  const tickers = uniqueTickers();
  if (!tickers.length) return;
  state.refreshing = true; renderStatusOnly();
  let batch = {};
  try {
    const r = await fetch("/api/quote?symbols=" + encodeURIComponent(tickers.join(",")), { cache: "no-store" });
    if (r.ok) batch = (await r.json()) || {};
  } catch (e) { /* fall through to client-side chain */ }
  const results = await Promise.all(tickers.map(async t => {
    const b = batch[t];
    if (b && b.price > 0) return Object.assign({}, b, { src: "site API" });
    return fetchTicker(t).catch(() => null);
  }));
  let ok = 0;
  results.forEach((r, i) => { if (r) { ok++; applyQuote(tickers[i], r); } });
  state.refreshing = false;
  state.lastMsg = ok === 0
    ? "Live quotes unavailable — showing last-known prices"
    : "Live: " + ok + "/" + tickers.length + " via " + (results.find(Boolean).src) + " · " + timeStr(Date.now());
  if (ok) store(); // local cache only — quote refreshes don't overwrite cloud edits
  render();
}
async function refreshOne(t) {
  const T = t.trim().toUpperCase();
  let r = null;
  try {
    const rr = await fetch("/api/quote?symbols=" + encodeURIComponent(T), { cache: "no-store" });
    if (rr.ok) { const j = await rr.json(); if (j && j[T] && j[T].price > 0) r = Object.assign({}, j[T], { src: "site API" }); }
  } catch (e) {}
  if (!r) r = await fetchTicker(T).catch(() => null);
  if (r) { applyQuote(T, r); store(); render(); }
}

/* ================= Portfolio math ================= */
function positionsValue() { return db.holdings.reduce((s,h) => s + h.sh * priceOf(h), 0); }
function marketValue() { return positionsValue() + (db.cash || 0); }
function principalOf(c, uptoYm) { return c.contributions.reduce((s,k) => s + ((!uptoYm || k.ym <= uptoYm) ? k.amount : 0), 0); }
function totalPrincipal(uptoYm) {
  // Investor sessions get an aggregated series instead of other
  // investors' records, so their ownership % still computes correctly.
  if (db.tpSeries && db.tpSeries.length) {
    let best = 0;
    for (const p of db.tpSeries) { if (!uptoYm || p.ym <= uptoYm) best = p.total; else break; }
    return best;
  }
  return db.clients.reduce((s,c) => s + principalOf(c, uptoYm), 0);
}
/* NAV/UNIT system: each contribution buys units at its entry price
   (units = amount ÷ entry $/unit). Unit price (NAV) = market value ÷ total
   units, so it moves with live prices. An investor's current value =
   their units × unit price — it is derived, never edited directly.
   Entries default to $1.00/unit until their entry price is set. */
function ensureUnits(d) {
  for (const c of d.clients || []) for (const k of c.contributions || []) if (!(k.units > 0)) k.units = k.amount;
}
function unitsOf(c, uptoYm) {
  return c.contributions.reduce((s,k) => s + ((!uptoYm || k.ym <= uptoYm) ? (k.units > 0 ? k.units : k.amount) : 0), 0);
}
function totalUnits(uptoYm) { return db.clients.reduce((s,c) => s + unitsOf(c, uptoYm), 0); }
function unitPrice() { const tu = totalUnits(); return tu > 0 ? marketValue() / tu : 1; }
function fracOf(c, uptoYm) { const tu = totalUnits(uptoYm); return tu ? unitsOf(c, uptoYm) / tu : 0; }
function withdrawnOf(c) { return (c.withdrawals || []).reduce((s,w) => s + (w.amount || 0), 0); }
function totalWithdrawn() { return db.clients.reduce((s,c) => s + withdrawnOf(c), 0); }
function feesTotal() { const v = db.fees && db.fees.total; return (typeof v === "number") ? v : null; }
function feesTaken() { const v = db.fees && db.fees.taken; return (typeof v === "number") ? v : 0; }
function feesRemaining() { const t = feesTotal(); return t == null ? null : t - feesTaken(); }
/* The fund's YTD figure is entered manually in Settings (e.g. from IBKR) — never computed. */
function manualYtd() { return (db.ytd === null || db.ytd === undefined || db.ytd === "") ? null : db.ytd / 100; }

function clientStats(c) {
  const mv = marketValue();
  const principal = principalOf(c);
  const frac = fracOf(c);
  const value = frac * mv;
  const gain = value - principal;
  const firstYm = c.contributions.length ? c.contributions.map(k => k.ym).sort()[0] : null;
  return { principal, frac, value, gain, gainPct: principal ? gain / principal : 0, firstYm };
}
function classBreakdown() {
  const m = {};
  for (const h of db.holdings) m[h.cls] = (m[h.cls] || 0) + h.sh * priceOf(h);
  if (db.cash) m["Cash"] = (m["Cash"] || 0) + db.cash;
  const mv = marketValue() || 1;
  return ASSET_CLASSES.filter(c => m[c]).map(c => ({ label: c, value: m[c] / mv * 100, mv: m[c] }));
}

/* Annual returns: portfolio vs S&P 500 (values entered by the manager) */
function annualRows() {
  return (db.annual || [])
    .filter(r => r && r.y)
    .slice()
    .sort((a,b) => a.y - b.y);
}
/* Annualized (compound / CAGR) return from the entered yearly returns:
   geometric mean of (1 + r/100) over the years that have a value. */
function annualizedOf(key) {
  const rows = annualRows().filter(r => typeof r[key] === "number");
  if (!rows.length) return null;
  let g = 1;
  for (const r of rows) g *= (1 + r[key] / 100);
  return { years: rows.length, annualized: Math.pow(g, 1 / rows.length) - 1, cumulative: g - 1 };
}

/* ================= Chart: annual returns (SVG drawn at the container's real width) =================
   Emphasis form: Portfolio in the accent, S&P 500 in context gray. Thin bars with a 2px gap,
   4px rounded data-ends, one baseline. Values are always readable in the ledger beside it. */
/* Finest "nice" step (1, 2, 2.5, 5 × 10^k) whose rounded domain has at most maxN intervals */
function niceScale(lo, hi, maxN) {
  const mag = Math.pow(10, Math.floor(Math.log10((hi - lo) / maxN)));
  for (const m of [1, 2, 2.5, 5, 10, 20, 25, 50, 100]) {
    const step = m * mag;
    const a = Math.floor(lo / step + 1e-9) * step, b = Math.ceil(hi / step - 1e-9) * step;
    if ((b - a) / step <= maxN + 1e-9) return { lo: a, hi: b, step };
  }
  return { lo, hi, step: hi - lo };
}
function barPath(x, w, yb, yv) {
  if (Math.abs(yb - yv) < 1.5) yv = yb - (yv <= yb ? 1.5 : -1.5); // zero still shows a stub
  const r = Math.min(4, w / 2, Math.abs(yb - yv));
  const s = yv < yb ? 1 : -1, x2 = x + w, f = (n) => n.toFixed(1);
  return `M${f(x)},${f(yb)}V${f(yv + s * r)}Q${f(x)},${f(yv)} ${f(x + r)},${f(yv)}H${f(x2 - r)}Q${f(x2)},${f(yv)} ${f(x2)},${f(yv + s * r)}V${f(yb)}Z`;
}
function drawAnnual(box) {
  const rows = annualRows();
  const W = Math.round(box.clientWidth);
  if (!rows.length || W < 10) return;
  if (box.dataset.w === String(W) && box.querySelector("svg")) return; // already drawn at this width
  box.dataset.w = String(W);
  const old = box.querySelector("svg"); if (old) old.remove();

  const has = (v) => typeof v === "number" && !isNaN(v);
  const vals = [];
  rows.forEach(r => { if (has(r.p)) vals.push(r.p); if (has(r.s)) vals.push(r.s); });
  let lo = Math.min(0, ...vals), hi = Math.max(0, ...vals);
  if (hi - lo < 1e-9) hi = lo + 10;
  const scale = niceScale(lo, hi, W < 480 ? 4 : 6);
  lo = scale.lo; hi = scale.hi;
  const step = scale.step;
  const padL = 42, padR = 4, padT = 24;
  const bandW = (W - padL - padR) / rows.length;
  // A negative Portfolio value carries its label below the bar end: reserve a band for it
  // above the year labels rather than stretching the axis.
  const labelBand = bandW >= 72 && rows.some(r => has(r.p) && r.p < 0) ? 18 : 0;
  const H = (W < 480 ? 230 : 280) + labelBand;
  const padB = 30 + labelBand, plotH = H - padT - padB;
  const Y = (v) => padT + plotH * (1 - (v - lo) / (hi - lo));
  const gap = 2;
  const barW = Math.max(3, Math.min(24, (bandW * 0.64 - gap) / 2));
  const y0 = Y(0), eps = step * 1e-6;
  const dec = Number.isInteger(step) ? 0 : Number.isInteger(step * 10) ? 1 : 2;

  let grid = "", bands = "", bars = "", labels = "", xl = "", hits = "";
  for (let v = lo; v <= hi + eps; v += step) {
    const y = Math.round(Y(v)) + 0.5;
    if (Math.abs(v) > eps) grid += `<line class="g-grid" x1="${padL}" x2="${W - padR}" y1="${y}" y2="${y}"/>`;
    grid += `<text class="g-tick" x="${padL - 10}" y="${(y + 4).toFixed(1)}" text-anchor="end">${(Math.abs(v) < eps ? 0 : v).toFixed(dec)}%</text>`;
  }
  const geo = [];
  rows.forEach((r, i) => {
    const x0 = padL + bandW * i, cx = x0 + bandW / 2;
    const xa = cx - gap / 2 - barW, xb = cx + gap / 2;
    bands += `<rect class="g-band" data-i="${i}" x="${(x0 + 3).toFixed(1)}" y="${padT - 16}" width="${Math.max(0, bandW - 6).toFixed(1)}" height="${(plotH + 16).toFixed(1)}" rx="6"/>`;
    if (has(r.p)) bars += `<path class="bar-a" d="${barPath(xa, barW, y0, Y(r.p))}"/>`;
    if (has(r.s)) bars += `<path class="bar-b" d="${barPath(xb, barW, y0, Y(r.s))}"/>`;
    // Direct label on the emphasized series only. It sits on its own bar end, right-aligned to
    // the bar's inner edge, so it never crosses into the neighbouring S&P 500 bar.
    if (has(r.p) && bandW >= 72) {
      const yv = Y(r.p);
      labels += `<text class="g-val" x="${(xa + barW).toFixed(1)}" y="${(r.p >= 0 ? yv - 7 : yv + 15).toFixed(1)}" text-anchor="end">${retText(r.p)}</text>`;
    }
    xl += `<text class="g-x" x="${cx.toFixed(1)}" y="${H - 9}" text-anchor="middle">${r.y}</text>`;
    geo.push({ cx, top: Math.min(y0, has(r.p) ? Y(r.p) : y0, has(r.s) ? Y(r.s) : y0) });
    hits += `<rect class="g-hit" data-i="${i}" tabindex="0" role="img" x="${x0.toFixed(1)}" y="0" width="${bandW.toFixed(1)}" height="${H}"
      aria-label="${r.y}: Portfolio ${retText(r.p)}, S&amp;P 500 ${retText(r.s)}"/>`;
  });
  const zy = Math.round(y0) + 0.5;
  const zero = `<line class="g-zero" x1="${padL}" x2="${W - padR}" y1="${zy}" y2="${zy}"/>`;
  box.insertAdjacentHTML("afterbegin",
    `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="group" aria-label="Annual returns, portfolio vs S&amp;P 500">${bands}${grid}${bars}${zero}${labels}${xl}${hits}</svg>`);
  wireAnnual(box, rows, geo);
}
function wireAnnual(box, rows, geo) {
  const tip = box.querySelector(".chart-tip");
  if (!tip) return;
  const bands = box.querySelectorAll(".g-band");
  const show = (i) => {
    const r = rows[i], g = geo[i]; if (!r || !g) return;
    bands.forEach(b => b.classList.toggle("is-hot", b.getAttribute("data-i") === String(i)));
    tip.textContent = "";
    const title = document.createElement("div");
    title.className = "tip-title"; title.textContent = String(r.y);
    tip.appendChild(title);
    [["Portfolio", r.p, "tk-a"], ["S&P 500", r.s, "tk-b"]].forEach(([name, v, cls]) => {
      const row = document.createElement("div"); row.className = "tip-row";
      const k = document.createElement("span"); k.className = "k";
      const key = document.createElement("i"); key.className = "tip-key " + cls;
      k.appendChild(key); k.appendChild(document.createTextNode(name));
      const val = document.createElement("span"); val.className = "v"; val.textContent = retText(v);
      row.appendChild(k); row.appendChild(val); tip.appendChild(row);
    });
    const half = (tip.offsetWidth || 170) / 2;
    tip.style.left = Math.max(half, Math.min(box.clientWidth - half, g.cx)) + "px";
    tip.style.top = Math.max(0, g.top - 4) + "px";
    tip.classList.add("on");
  };
  const hide = () => { tip.classList.remove("on"); bands.forEach(b => b.classList.remove("is-hot")); };
  box.querySelectorAll(".g-hit").forEach(h => {
    const i = +h.getAttribute("data-i");
    h.addEventListener("pointerenter", () => show(i));
    h.addEventListener("pointerleave", hide);
    h.addEventListener("focus", () => show(i));
    h.addEventListener("blur", hide);
  });
}
function drawCharts() { document.querySelectorAll('[data-chart="annual"]').forEach(drawAnnual); }

      <div><h2 class="panel-title">Portfolio vs S&amp;P 500</h2><p class="panel-sub">Annual returns, as reported by the fund manager</p></div>

    </div>
    ${rows.length ? `
    <div class="perf">
      <figure class="chart" data-chart="annual"><div class="chart-tip" role="tooltip"></div></figure>
      ${returnsLedgerHTML(rows, withAnnualized)}
    </div>` : `<p class="empty">No annual returns entered yet${isAdminUI() ? " — add them in the <b>Annual returns</b> section of the Admin tab." : "."}</p>`}
  </section>`;
}
function returnsLedgerHTML(rows, withAnnualized) {
  const cell = (v) => `<td class="num${typeof v === "number" && v < 0 ? " neg" : ""}">${retText(v)}</td>`;
  let foot = "";
  if (withAnnualized) {
    const p = annualizedOf("p"), s = annualizedOf("s");
    if (p || s) {
      const yrs = Math.max(p ? p.years : 0, s ? s.years : 0);
      const ann = (x) => `<td class="num${x ? " " + pctClass(x.annualized) : ""}">${x ? fmtPct(x.annualized) : "—"}</td>`;
      const cum = (x) => `<td class="num">${x ? fmtPct(x.cumulative) : "—"}</td>`;
      foot = `<tfoot>
        <tr class="total"><td>Annualized<span class="tf-sub">compound, over ${yrs} year${yrs===1?"":"s"}</span></td>${ann(p)}${ann(s)}</tr>
        <tr class="cum"><td>Cumulative</td>${cum(p)}${cum(s)}</tr>
      </tfoot>`;
    }
  }
  return `<div class="tbl-wrap"><table class="ledger">
    <thead><tr><th>Year</th><th class="num">Portfolio</th><th class="num">S&amp;P 500</th></tr></thead>
    <tbody>${rows.map(r => `<tr><td>${r.y}</td>${cell(r.p)}${cell(r.s)}</tr>`).join("")}</tbody>
    ${foot}
  </table></div>`;
}
function investorsPanelHTML(viewingId) {
  const viewing = viewingId != null;
  return `<section class="panel">
    <div class="panel-head"><div><h2 class="panel-title">Investor performance</h2>
      <p class="panel-sub">${viewing ? "All investors, marked to the latest prices" : "Each investor's position, marked to the latest prices"}</p></div></div>
    <div class="tbl-wrap"><table class="data perf-tbl">
      <thead><tr><th>Investor</th><th class="num">Principal</th><th class="num">Ownership</th><th class="num">Current value</th><th class="num">Gain ($)</th><th class="num">Gain (%)</th></tr></thead>
      <tbody>${db.clients.map(x => `<tr><td><span class="inv-name">${esc(x.name)}</span>${viewing && String(x.id)===String(viewingId) ? '<span class="pill is-accent">viewing</span>' : ""}</td>${perfRowHTML(clientStats(x))}</tr>`).join("")

function feesPanel() {
  const t = feesTotal(), taken = feesTaken(), rem = feesRemaining();
  const share = t != null && t > 0 ? taken / t : null;
  return `<section class="panel">
    <div class="panel-head"><div><h2 class="panel-title">Fees</h2><p class="panel-sub">Management/performance fees for the fund, as recorded by the manager</p></div></div>
    <div class="stats">
      <div class="stat"><div class="label">Total fees</div><div class="stat-fig">${t==null ? "—" : fmtMoney(t)}</div>
        <div class="kpi-sub">${t==null ? (isAdminUI() ? "set in Admin → Fees" : "not yet recorded") : "agreed / accrued to date"}</div></div>
      <div class="stat"><div class="label">Fees taken</div><div class="stat-fig">${fmtMoney(taken)}</div><div class="kpi-sub">collected so far</div></div>
      <div class="stat"><div class="label">Fees remaining</div><div class="stat-fig">${rem==null ? "—" : fmtMoney(rem)}</div><div class="kpi-sub">still to be collected</div></div>

function perfRowHTML(st) {
  const own = Math.min(100, Math.max(0, st.frac*100));
  return `
    <td class="num" data-label="Principal">${fmtMoney(st.principal)}</td>
    <td class="num" data-label="Ownership"><span class="own"><span class="own-bar" aria-hidden="true"><i style="width:${own.toFixed(1)}%"></i></span>${(st.frac*100).toFixed(1)}%</span></td>
    <td class="num" data-label="Current value">${fmtMoney(st.value)}</td>
    <td class="num ${pctClass(st.gain)}" data-label="Gain ($)">${fmtMoney(st.gain)}</td>
    <td class="num ${pctClass(st.gain)}" data-label="Gain (%)">${fmtPct(st.gainPct)}</td>`;
}

/* ---- Holdings ---- */
function priceCellHTML(h) {
  const q = quote(h.t), live = isLive(h), p = priceOf(h);
  let sub = `<span class="badge b-man">fallback</span>`;
  if (live && q.prev > 0) {
    const d = q.price / q.prev - 1;
    sub = `<span class="chg ${pctClass(d)}">${d >= 0 ? "▲" : "▼"} ${fmtPct(d)} today</span>`;
  } else if (live) {
    sub = `<span class="badge b-live">live</span>`;
  }
  return `${fmtPrice(p)}<div class="px-sub">${sub}</div>`;
}
function weightHTML(val, mv, maxVal, isCash) {
  const w = maxVal > 0 ? Math.max(0, val) / maxVal * 100 : 0;
  return `<span class="wt"><span class="wt-bar${isCash ? " is-cash" : ""}" aria-hidden="true"><i style="width:${w.toFixed(1)}%"></i></span>${mv ? (val/mv*100).toFixed(1) : "0.0"}%</span>`;
}
function holdingsView() {
  const segs = classBreakdown();
  const mv = marketValue();
  const c = currentClient();
  const mine = c ? clientStats(c).frac : 1;
  const baseLabel = c ? esc(c.name) + "'s " + (mine*100).toFixed(1) + "% share" : "the whole fund";
  const rows = [...db.holdings].sort((a,b) => b.sh*priceOf(b) - a.sh*priceOf(a));
  const maxVal = Math.max(db.cash || 0, ...rows.map(h => h.sh * priceOf(h)));
  return `
  <div class="page-head">
    <div><h1 class="page-title">Holdings &amp; allocation</h1></div>
    <div class="px-status" id="px-status">${statusHTML()}</div>
  </div>
  <div class="split">
    <section class="panel">
      <div class="panel-head"><div><h2 class="panel-title">Asset allocation</h2><p class="panel-sub">By asset class, including cash</p></div></div>
      <ul class="alloc">${segs.map(s => `
        <li>
          <div class="alloc-top"><span>${esc(s.label)}</span><span class="num">${s.value.toFixed(1)}%</span></div>
          <div class="alloc-bar${s.label === "Cash" ? " is-cash" : ""}" aria-hidden="true"><i style="width:${s.value.toFixed(2)}%"></i></div>
        </li>`).join("")}
      </ul>
      <div class="alloc-total"><span>Fund market value</span><span class="num">${fmtMoney(mv)}</span></div>
    </section>
    <section class="panel">
      <div class="panel-head"><div><h2 class="panel-title">Portfolio holdings</h2><p class="panel-sub">Values shown for ${baseLabel}</p></div></div>
      <div class="tbl-wrap"><table class="data holdings">
        <thead><tr><th>Position</th><th>Class</th><th class="num">Price</th><th class="num">Weight</th><th class="num">Value</th></tr></thead>
        <tbody>
        ${rows.map(h => {
          const val = h.sh * priceOf(h);
          return `<tr>
            <td><div class="pos-name">${esc(h.name || h.t)}</div><div class="tkr">${esc(h.t.toUpperCase())}<span class="m-only m-cls"> · ${esc(h.cls)}</span></div></td>
            <td><span class="pill">${esc(h.cls)}</span></td>
            <td class="num">${priceCellHTML(h)}</td>
            <td class="num">${weightHTML(val, mv, maxVal)}</td>
            <td class="num">${fmtMoney(val * mine)}</td>
          </tr>`;
        }).join("")}
        <tr>
          <td><div class="pos-name">Cash &amp; equivalents</div><div class="tkr">USD<span class="m-only m-cls"> · Cash</span></div></td>
          <td><span class="pill">Cash</span></td>
          <td class="num muted px-none">—</td>
          <td class="num">${weightHTML(db.cash || 0, mv, maxVal, true)}</td>
          <td class="num">${fmtMoney((db.cash||0) * mine)}</td>
        </tr>
        </tbody>
      </table></div>
    </section>
  </div>`;
}

      <div class="field fw-sm"><label for="an-s">S&amp;P 500 %</label><input id="an-s" type="number" step="0.1" placeholder="24.2"></div>
      <button class="btn btn-primary" onclick="app.addAnnual()">Add year</button>
    </div>
    <div class="flash" id="an-flash"></div>
  </section>

  <section class="panel" id="adm-fees">
    <div class="panel-head"><div><h2 class="panel-title">Fees</h2>
      <p class="panel-sub">Enter the fund's total fees and how much has been collected. <b>Fees remaining</b> is computed as total − taken.</p></div></div>
    <div class="form-row">
      <div class="field fw-sm"><label for="fee-total">Total fees (USD)</label>
        <input id="fee-total" type="number" step="100" value="${feesTotal() ?? ""}" placeholder="e.g. 25000" onchange="app.editFees('total',this.value)"></div>
      <div class="field fw-sm"><label for="fee-taken">Fees taken (USD)</label>
        <input id="fee-taken" type="number" step="100" value="${(db.fees && typeof db.fees.taken === 'number') ? db.fees.taken : ''}" placeholder="e.g. 10000" onchange="app.editFees('taken',this.value)"></div>
      <div class="field fw-sm"><label for="fee-rem">Fees remaining</label>
        <input id="fee-rem" type="text" value="${feesRemaining()==null ? '—' : fmtMoney(feesRemaining())}" disabled></div>
    </div>
    <div class="flash" id="fee-flash"></div>
  </section>

  <section class="panel" id="adm-settings">
    <div class="panel-head"><div><h2 class="panel-title">Settings</h2>
      <p class="panel-sub">The fund name appears in the header, browser tab, and footer.</p></div></div>
    <div class="form-row" style="margin-bottom:24px">
      <div class="field fw-md"><label for="fund-name">Fund name</label>
        <input id="fund-name" value="${esc(db.fund.name)}" onchange="app.editFund('name',this.value)"></div>
      <div class="field fw-lg"><label for="fund-label">Legal name / footer label</label>
        <input id="fund-label" value="${esc(db.fund.label)}" onchange="app.editFund('label',this.value)"></div>
    </div>
    <p class="hint">The YTD figure on the fund overview is whatever you enter here (e.g. from your IBKR statement) — it is never computed. Leave blank to show “—”.</p>
    <div class="form-row" style="margin-bottom:24px">
      <div class="field fw-sm"><label for="fund-ytd">YTD return (%)</label>
        <input id="fund-ytd" type="number" step="0.1" value="${db.ytd ?? ""}" placeholder="e.g. 6.8 or -2.3" onchange="app.setYtd(this.value)"></div>
    </div>
    <p class="hint">Live quotes come from this site's own API when deployed (most reliable) with public Yahoo routes as backup.
      Optionally add a free <b>finnhub.io</b> API key as an extra source.</p>
    <div class="form-row">
      <div class="field fw-lg"><label for="api-key">Finnhub API key (optional)</label>
        <input id="api-key" value="${esc(db.key||"")}" placeholder="paste key here"></div>
      <button class="btn btn-primary" onclick="app.setKey()">Save key</button>
      <button class="btn btn-danger" onclick="app.reset()">Reset to sample data</button>
    </div>
    <div class="flash" id="set-flash"></div>
  </section>`;
}

/* ================= Actions ================= */
window.app = {
  tab(t) { if (t === "admin" && !isAdminUI()) t = "overview"; state.tab = t; render(); },
  setViewer(v) {
    if (!isAdminUI()) return; // only the admin previews individual accounts
    state.viewer = v;
    render();
  },
  refresh() { refreshAll(); },
  toggleTheme() {
    const r = document.documentElement;
    const cur = r.getAttribute("data-theme") ||
      (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    const next = cur === "dark" ? "light" : "dark";
    r.setAttribute("data-theme", next);
    try { localStorage.setItem(THEME_KEY, next); } catch (e) {}
  },
  jump(id) {
    const el = $(id); if (!el) return;
    const calm = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    el.scrollIntoView({ behavior: calm ? "auto" : "smooth", block: "start" });
  },

  loginRole(r) { state.loginRole = r; render(); const p = $("li-pass"); if (p) p.focus(); },
  async signIn() {
    const role = state.loginRole === "admin" ? "admin" : "investor";
    const pw = $("li-pass") ? $("li-pass").value : "";
    const label = role === "admin" ? "fund manager" : "investor";
    const btn = $("li-btn"); if (btn) { btn.disabled = true; btn.textContent = "Signing in…"; }
    const fail = (msg) => { const e = $("li-err"); if (e) e.textContent = msg; if (btn) { btn.disabled = false; btn.textContent = "Sign in as " + label; } };
    if (!pw) return fail("Enter the password.");
    try {
      const r = await fetch("/api/auth", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action: "login", email: role, password: pw })
      });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) {
        return fail(j.error === "investor-login-not-configured"
          ? "Investor sign-in isn't set up yet — add INVESTOR_PASSWORD in Vercel and redeploy."
          : "Password incorrect for " + label + ".");
      }
      enterApp(j);
    } catch (e) { fail("Could not reach the server — try again."); }
  },
  async signOut() {
    try { await fetch("/api/auth", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ action: "logout" }) }); } catch (e) {}
    sessionExpired();
  },

  editFund(k, v) {
    v = v.trim();
    db.fund[k] = v || DEFAULTS().fund[k];
    storeAndSync(); render();
    flash("set-flash", "Fund details updated.");
  },
  editH(i, key, val) {
    const h = db.holdings[i]; if (!h) return;
    if (key === "sh" || key === "fb") {
      const n = parseFloat(val);
      if (isNaN(n) || n < 0) { render(); return; }
      h[key] = n;
    } else if (key === "t") {
      h.t = val.trim().toUpperCase();
      if (h.t) refreshOne(h.t);
    } else h[key] = val;
    storeAndSync(); render();
  },
  delH(i) { db.holdings.splice(i,1); storeAndSync(); render(); },
  addH() { db.holdings.push({ t:"", name:"", cls:"US Equity", sh:0, fb:0 }); storeAndSync(); render(); },
  setCash(v) { const n = parseFloat(v); db.cash = isNaN(n) || n < 0 ? 0 : n; storeAndSync(); render(); },

  // A contribution is cash into the fund: increasing cash by the same amount
  // keeps the unit price (NAV) continuous, so new money starts at 0% gain.
  _recordContribution(c, amt, ym, eprice, flashId) {
    const units = amt / eprice;
    c.contributions.push({ ym, amount: amt, units });
    db.cash = (db.cash || 0) + amt;
    storeAndSync(); render();
    flash(flashId, fmtMoney(amt) + " recorded for " + c.name + " at " + fmtPrice(eprice) + "/unit (" +
      units.toLocaleString(undefined,{maximumFractionDigits:2}) + " units); fund cash +" + fmtMoney(amt) + ".");
  },
  addInvestor() {
    const name = $("ni-name").value.trim();
    const email = $("ni-email").value.trim().toLowerCase();
    const amt = parseFloat($("ni-amt").value);
    const ym = $("ni-ym").value.trim();
    let eprice = parseFloat($("ni-price") ? $("ni-price").value : "");
    if (!(eprice > 0)) eprice = unitPrice();
    if (!name || !email.includes("@")) { flash("ni-flash", "Enter a name and valid email.", true); return; }
    if (db.clients.some(x => x.email === email)) { flash("ni-flash", "That email already exists — use “Add a contribution” below.", true); return; }
    if (!validYm(ym)) { flash("ni-flash", "Enter month as YYYY-MM.", true); return; }
    if (!(amt > 0)) { flash("ni-flash", "Enter a valid amount.", true); return; }
    const c = { id: Date.now(), name, email, contributions: [] };
    db.clients.push(c);
    this._recordContribution(c, amt, ym, eprice, "ni-flash");
  },
  addContribution() {
    const sel = $("ac-sel"); if (!sel) return;
    const c = db.clients.find(x => String(x.id) === String(sel.value));
    if (!c) { flash("ac-flash", "Pick an investor.", true); return; }
    const amt = parseFloat($("ac-amt").value);
    const ym = $("ac-ym").value.trim();
    let eprice = parseFloat($("ac-price") ? $("ac-price").value : "");
    if (!(eprice > 0)) eprice = unitPrice();
    if (!validYm(ym)) { flash("ac-flash", "Enter month as YYYY-MM.", true); return; }
    if (!(amt > 0)) { flash("ac-flash", "Enter a valid amount.", true); return; }
    this._recordContribution(c, amt, ym, eprice, "ac-flash");
  },
  withdraw() {
    const sel = $("wd-sel"); if (!sel) return;
    const c = db.clients.find(x => String(x.id) === String(sel.value));
    if (!c) { flash("wd-flash", "Pick an investor.", true); return; }
    const amt = parseFloat($("wd-amt").value);
    const ym = $("wd-ym").value.trim();
    let xprice = parseFloat($("wd-price") ? $("wd-price").value : "");
    if (!(xprice > 0)) xprice = unitPrice();
    if (!validYm(ym)) { flash("wd-flash", "Enter month as YYYY-MM.", true); return; }
    if (!(amt > 0)) { flash("wd-flash", "Enter a valid amount.", true); return; }
    const held = unitsOf(c);
    const unitsOut = amt / xprice;               // units redeemed at the exit price
    const maxAmt = held * xprice;                // most they can take out at that price
    if (unitsOut > held * 1.000001) {
      flash("wd-flash", "At " + fmtPrice(xprice) + "/unit the most " + c.name + " can withdraw is " + fmtMoney(maxAmt) + " (" + held.toLocaleString(undefined,{maximumFractionDigits:2}) + " units).", true);
      return;
    }
    const frac = held > 0 ? unitsOut / held : 0;
    // Redeem units pro-rata: scale each contribution's units and cost basis down
    // by the redeemed fraction. Entry prices and gain % are preserved.
    const full = frac >= 0.9999;
    if (full) {
      c.contributions = [{ ym, amount: 0, units: 0 }];
    } else {
      for (const k of c.contributions) { k.units = (k.units > 0 ? k.units : k.amount) * (1 - frac); k.amount = k.amount * (1 - frac); }
    }
    if (!c.withdrawals) c.withdrawals = [];
    c.withdrawals.push({ ym, amount: amt, units: unitsOut, price: xprice }); // record for the withdrawals section
    db.cash = (db.cash || 0) - amt; // cash paid out of the fund
    storeAndSync(); render();
    flash("wd-flash", fmtMoney(amt) + " withdrawn for " + c.name + " at " + fmtPrice(xprice) + "/unit (" +
      unitsOut.toLocaleString(undefined,{maximumFractionDigits:2}) + " units redeemed)" + (full ? " — position closed" : "") + "; fund cash −" + fmtMoney(amt) + ".");
  },
  delClient(id) {
    const who = db.clients.find(c => c.id === id);
    if (who && !confirm("Remove " + who.name + " and all of their contribution and withdrawal records? This can't be undone.")) return;
    db.clients = db.clients.filter(c => c.id !== id); if (String(state.viewer) === String(id)) state.viewer = "fund"; storeAndSync(); render();
  },
  toggleContrib(id) { state.editInv = String(state.editInv) === String(id) ? null : id; render(); },
  editClient(id, key, val) {
    const c = db.clients.find(x => String(x.id) === String(id)); if (!c) return;
    val = String(val).trim();
    if (key === "email") {
      val = val.toLowerCase();
      if (!val.includes("@")) { flash("inv-edit-flash", "Enter a valid email.", true); render(); return; }
      if (db.clients.some(x => x.id !== c.id && x.email === val)) { flash("inv-edit-flash", "That email is already used by another investor.", true); render(); return; }
      c.email = val;
      flash("inv-edit-flash", "Email updated for " + c.name + ".");
    } else if (key === "name") {
      if (!val) { render(); return; }
      c.name = val;
    }
    storeAndSync(); render();
  },
  editContrib(id, j, key, val) {
    const c = db.clients.find(x => String(x.id) === String(id));
    if (!c || !c.contributions[j]) return;
    const k = c.contributions[j];
    if (key === "ym") {
      val = String(val).trim();
      if (!validYm(val)) { flash("inv-edit-flash", "Enter the month as YYYY-MM (e.g. 2026-07).", true); render(); return; }
      k.ym = val;
    } else if (key === "amount") {
      const n = parseFloat(val);
      if (!(n > 0)) { flash("inv-edit-flash", "Enter an amount above zero.", true); render(); return; }
      const price = k.units > 0 ? k.amount / k.units : 1; // keep the entry price fixed
      k.amount = n;
      k.units = n / price;
    } else if (key === "eprice") {
      const n = parseFloat(val);
      if (!(n > 0)) { flash("inv-edit-flash", "Entry price must be above zero.", true); render(); return; }
      k.units = k.amount / n;
      flash("inv-edit-flash", "Entry price set — " + c.name + "'s value and gain now reflect it.");
    } else if (key === "units") {
      const n = parseFloat(val);
      if (!(n > 0)) { flash("inv-edit-flash", "Units must be above zero.", true); render(); return; }
      k.units = n;
    }
    storeAndSync(); render();
  },
  delContrib(id, j) {
    const c = db.clients.find(x => String(x.id) === String(id)); if (!c) return;
    c.contributions.splice(j, 1);
    storeAndSync(); render();
  },
  addAnnual() {
    const y = parseInt($("an-y").value, 10);
    const pRaw = $("an-p").value.trim(), sRaw = $("an-s").value.trim();
    if (!(y > 1900 && y < 2200)) { flash("an-flash", "Enter a valid year.", true); return; }
    if (!db.annual) db.annual = [];
    if (db.annual.some(r => r.y === y)) { flash("an-flash", y + " is already listed — edit it in the table above.", true); return; }
    const p = pRaw === "" ? null : parseFloat(pRaw);
    const s = sRaw === "" ? null : parseFloat(sRaw);
    if ((pRaw !== "" && isNaN(p)) || (sRaw !== "" && isNaN(s))) { flash("an-flash", "Returns must be numbers like 12.4 or -8.3.", true); return; }
    db.annual.push({ y, p, s });
    storeAndSync(); render();
    flash("an-flash", y + " added.");
  },
  editAnnual(year, key, val) {
    const r = (db.annual || []).find(x => x.y === year); if (!r) return;
    val = String(val).trim();
    if (key === "y") {
      const n = parseInt(val, 10);
      if (!(n > 1900 && n < 2200)) { flash("an-flash", "Enter a valid year.", true); render(); return; }
      if (n !== year && db.annual.some(x => x.y === n)) { flash("an-flash", n + " is already listed.", true); render(); return; }
      r.y = n;
    } else {
      if (val === "") { r[key] = null; }
      else {
        const n = parseFloat(val);
        if (isNaN(n)) { flash("an-flash", "Returns must be numbers like 12.4 or -8.3.", true); render(); return; }
        r[key] = n;
      }
    }
    storeAndSync(); render();
  },
  delAnnual(year) { db.annual = (db.annual || []).filter(r => r.y !== year); storeAndSync(); render(); },
  editFees(key, val) {
    if (!db.fees) db.fees = { total: null, taken: null };
    val = String(val).trim();
    if (val === "") { db.fees[key] = null; }
    else {
      const n = parseFloat(val);
      if (isNaN(n) || n < 0) { flash("fee-flash", "Enter a valid amount (0 or more).", true); render(); return; }
      db.fees[key] = n;
    }
    storeAndSync(); render();
    const rem = feesRemaining();
    flash("fee-flash", "Fees updated" + (rem == null ? "." : " — remaining " + fmtMoney(rem) + "."));
  },
  setYtd(v) {
    v = String(v).trim();
    if (v === "") {
      db.ytd = null;
      storeAndSync(); render();
      flash("set-flash", "YTD cleared — shown as “—” until you set it.");
      return;
    }
    const n = parseFloat(v);
    if (isNaN(n) || n < -100 || n > 1000) { flash("set-flash", "Enter a percentage like 6.8 or -2.3.", true); render(); return; }
    db.ytd = n;
    storeAndSync(); render();
    flash("set-flash", "YTD set to " + fmtPct(n / 100) + " — investors see this figure.");
  },
  setKey() {
    db.key = $("api-key").value.trim();
    storeAndSync(); flash("set-flash", db.key ? "API key saved — refreshing quotes." : "API key cleared.");
    if (db.key) refreshAll();
  },
  reset() {
    const msg = auth.mode === "in"
      ? "Replace ALL fund data with the sample data? This overwrites the shared data every investor sees and can't be undone."
      : "Replace the data saved in this browser with the sample data?";
    if (!confirm(msg)) return;
    try { localStorage.removeItem(STORE_KEY); } catch (e) {}
    db = DEFAULTS();
    storeAndSync(); render(); refreshAll();
  }
};

function flash(id, msg, isErr) {
  const el = $(id); if (!el) return;
  el.textContent = msg;
  el.className = "flash" + (isErr ? " warn" : "");
}
function flashHTML(id, html) {
  const el = $(id); if (!el) return;
  el.innerHTML = html;
  el.className = "flash";
}

function afterRender() { drawCharts(); }
let chartResizeTimer = null;
window.addEventListener("resize", () => { clearTimeout(chartResizeTimer); chartResizeTimer = setTimeout(drawCharts, 120); });
try { document.fonts.ready.then(drawCharts); } catch (e) {}

/* ================= Boot ================= */
async function enterApp(sess) {
  auth.mode = "in"; auth.role = sess.role; auth.name = sess.name; auth.cid = null;
  cloudMode = "on";
  state.viewer = "fund"; state.tab = "overview";
  const remote = await cloudLoad();
  if (remote && Array.isArray(remote.holdings)) {
    db = Object.assign(DEFAULTS(), remote); ensureUnits(db); store();
  } else if (auth.role === "admin") {
    db.at = db.at || Date.now();
    cloudSave(); // first run: seed the cloud with local/sample data
  }
  render();
  refreshAll();
}
loadStore();
ensureUnits(db);
render(); // loading screen while the session is checked
(async () => {
  if (typeof fetch !== "function") { auth.mode = "local"; render(); return; }
  let st = null;
  try {
    const r = await fetch("/api/auth", { cache: "no-store" });
    if (!r.ok && r.status !== 501) throw new Error("no api");
    st = await r.json();
  } catch (e) {
    // No API — opened as a local file / static preview: open mode, browser-only saves
    auth.mode = "local"; cloudMode = "none";
    render(); refreshAll();
    return;
  }
  auth.flags = st || {};
  if (!st || !st.blob || !st.admin) { cloudMode = "nostore"; auth.mode = "setup"; render(); return; }
  if (!st.authed) { auth.mode = "login"; render(); return; }
  enterApp(st);
})();
setInterval(() => {
  if (auth.mode !== "in" && auth.mode !== "local") return;
  if (typeof document.visibilityState === "string" && document.visibilityState !== "visible") return;
  refreshAll();
}, 5 * 60 * 1000);
setInterval(pollSync, 20 * 1000); // pick up other devices' edits within ~20s
setInterval(() => { // auto-retry failed saves even without a new edit
  if (state.syncErr && auth.mode === "in" && auth.role === "admin") cloudSave();
}, 30 * 1000);
try { // catch up immediately when this tab/device comes back into view
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible" && auth.mode === "in") { pollSync(); refreshAll(); }
  });
} catch (e) {}
</script>
</body>
